name: NPU Synth Tests

on:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/npu-synth-tests.yml"
      - "npu/synth/**"
      - "scripts/run_sweep.py"
      - "tests/test_noc_segmented_mesh4x4_aggregate_retry.py"
      - "tests/test_run_block_sweep_mode_compare.py"
      - "tests/test_run_sweep.py"
  pull_request:
    paths:
      - ".github/workflows/npu-synth-tests.yml"
      - "npu/synth/**"
      - "scripts/run_sweep.py"
      - "tests/test_noc_segmented_mesh4x4_aggregate_retry.py"
      - "tests/test_run_block_sweep_mode_compare.py"
      - "tests/test_run_sweep.py"
  workflow_dispatch:

jobs:
  mode-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Run synthesis sweep regression tests
        run: >-
          python -m pytest -q
          tests/test_noc_segmented_mesh4x4_aggregate_retry.py
          tests/test_run_block_sweep_mode_compare.py
          tests/test_run_sweep.py
