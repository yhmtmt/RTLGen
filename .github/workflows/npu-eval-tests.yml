name: NPU Eval Tests

on:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/npu-eval-tests.yml"
      - "npu/eval/**"
      - "npu/sim/perf/**"
      - "runs/campaigns/npu/e2e_eval_v0/**"
      - "tests/test_eval_campaign_tools.py"
      - "tests/test_run_campaign_mapper_notes.py"
  pull_request:
    paths:
      - ".github/workflows/npu-eval-tests.yml"
      - "npu/eval/**"
      - "npu/sim/perf/**"
      - "runs/campaigns/npu/e2e_eval_v0/**"
      - "tests/test_eval_campaign_tools.py"
      - "tests/test_run_campaign_mapper_notes.py"
  workflow_dispatch:

jobs:
  eval-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install eval-tool test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml

      - name: Run eval-tool regression tests
        run: |
          python tests/test_eval_campaign_tools.py
          python tests/test_run_campaign_mapper_notes.py
          python -m pytest -q \
            npu/eval/tests/test_recost_llm_decoder_attention_score32_noc_phase2_finite_endpoint_composed.py \
            npu/eval/tests/test_audit_llm_decoder_attention_score32_finite_endpoint_final_frontier.py \
            npu/eval/tests/test_audit_attention_score32_exact_shared_root_storage_physical_frontier.py \
            npu/eval/tests/test_probe_llama7b_score32_exact_cluster_release_cadence.py \
            npu/eval/tests/test_prepare_llama7b_score32_exact_shared_mesh_release_replay.py \
            npu/eval/tests/test_run_llama7b_score32_exact_shared_mesh_release_replay.py \
            npu/eval/tests/test_audit_llama7b_score32_exact_kv_ingress_closure.py \
            npu/eval/tests/test_attention_kv_capacity_gather_scheduler.py \
            npu/eval/tests/test_check_attention_score32_exact_kv_key_ingress_ppa_guard.py \
            npu/eval/tests/test_check_attention_score32_exact_kv_key_ingress_ppa_metrics.py
